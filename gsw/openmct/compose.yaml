
services:

  openmct:
    build:
      context: ./
      dockerfile: Containerfile
      args:
        DEPLOYMENT_ENVIRO: ${DEPLOYMENT_ENVIRO}
        HTTPS_PROXY: ${HTTPS_PROXY}
        HTTP_PROXY: ${HTTP_PROXY}
        NO_PROXY: ${NO_PROXY}
        MAVEN_HTTPS_PROXY: ${MAVEN_HTTPS_PROXY}
        GIT_URL: https://github.com/akhenry/openmct-yamcs.git
        GIT_COMMIT: master
        IMAGE_URI: ${IMAGE_URI}
        NVM_VERSION: v0.40.1
        NODE_VERSION: v21.7.3
    attach: true
    container_name: sc01-openmct
    hostname: sc01-openmct
    working_dir: "/opt/openmct"
    volumes:
      - "${PWD}/openmct/entrypoint.sh:/opt/openmct/entrypoint.sh"
      - "${PWD}/openmct/webpack.dev.mjs:/opt/openmct/.webpack/webpack.dev.mjs"
      - "${PWD}/openmct/example/index.js:/opt/openmct/example/index.js"
      - "${PWD}/openmct/example/make-example-events.mjs:/opt/openmct/example/make-example-events.mjs"      
    command: '/opt/openmct/entrypoint.sh'
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    networks:
      nos3-core:
        aliases:
          - openmct
          - sc01-openmct
      nos3-sc01:
        aliases:
          - openmct
          - sc01-openmct

networks:
  nos3-core:
    external: true
  nos3-sc01:
    external: true
