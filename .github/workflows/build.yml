name: NOS3 CI

on:
  pull_request:

jobs:
  system-test:
    name: NOS3 System Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Docker version
        run: docker version

      - name: Prepare environment
        run: |
          mkdir -p $HOME/.nos3_data
          sudo mkdir -p /tmp/nos3/data/{cam,evs,hk,inst} /tmp/nos3/uplink
          cp fsw/build/exe/cpu1/cf/cfe_es_startup.scr /tmp/nos3/uplink/tmp0.so || true
          cp fsw/build/exe/cpu1/cf/sample.so /tmp/nos3/uplink/tmp1.so || true

      - name: Create core network
        run: |
          docker network rm nos3_core || true
          docker network create --driver=bridge --subnet=192.168.41.0/24 --gateway=192.168.41.1 nos3_core

      - name: Launch COSMOS GSW
        run: |
          docker run -d --name cosmos_openc3-operator_1 \
            --log-driver json-file --log-opt max-size=5m --log-opt max-file=3 \
            -v "$PWD/gsw/config:/cosmos/config:ro" \
            -v "$PWD/gsw:/cosmos" \
            -v "$PWD/scripts:/scripts:ro" \
            -v /tmp/nos3:/tmp/nos3 \
            --network=nos3_core \
            -w /cosmos/tools \
            ballaerospace/cosmos:4.5.0 tail -f /dev/null

      - name: Launch CmdTlmServer in COSMOS
        run: |
          docker exec cosmos_openc3-operator_1 bash -c "apt update && apt install -y xvfb"
          docker exec -d cosmos_openc3-operator_1 bash -c "xvfb-run ruby CmdTlmServer /cosmos/config/tools/cmd_tlm_server/cmd_tlm_server.txt"

      - name: Create spacecraft network and launch components
        run: |
          CFG_FILE="-f nos3-simulator.xml"
          SATNUM=1

          docker network rm nos3_sc_1 || true
          docker network create nos3_sc_1
          docker network connect nos3_sc_1 cosmos_openc3-operator_1 --alias cosmos --alias active-gs

          cp -r cfg/build/InOut $HOME/.nos3_data/NOS3InOut

          docker run -d --name sc_1_42 --network=nos3_sc_1 \
            -e DISPLAY=$DISPLAY \
            -v "$HOME/.nos3_data:$HOME/.nos3_data" \
            -v /tmp/.X11-unix:/tmp/.X11-unix:ro \
            -w "$HOME/.nos3_data/42" ivvitc/nos3-64:20250124 ./42 NOS3InOut

          docker run -dit --name sc_1_nos_fsw --network=nos3_sc_1 \
            -v "$PWD:/mnt/workspace" -w "/mnt/workspace/fsw/build/exe/cpu1" \
            -e LD_LIBRARY_PATH=/mnt/workspace/fsw:/usr/lib:/usr/local/lib \
            --sysctl fs.mqueue.msg_max=10000 --ulimit rtprio=99 --cap-add=sys_nice \
            ivvitc/nos3-64:20250124 ./core-cpu1 -R PO

          docker run -d --name sc_1_cryptolib --network=nos3_sc_1 \
            -v "$PWD:/mnt/workspace" -w "/mnt/workspace/gsw/build" \
            --network-alias=cryptolib \
            ivvitc/nos3-64:20250124 ./support/standalone

          docker run -dit --name sc_1_nos_engine_server --network=nos3_sc_1 \
            -v "$PWD/sim:/mnt/sim" -w "/mnt/sim" \
            ivvitc/nos3-64:20250124 /usr/bin/nos_engine_server_standalone -f /mnt/sim/nos_engine_server_config.json

          docker run -d --name sc_1_truth42sim --network=nos3_sc_1 \
            -v "$PWD/sim:/mnt/sim" -w "/mnt/sim" \
            ivvitc/nos3-64:20250124 ./nos3-single-simulator $CFG_FILE truth42sim

          for sim in \
              camsim generic_css_sim generic_eps_sim generic_fss_sim \
              gps generic_imu_sim generic_mag_sim \
              generic-reactionwheel-sim0 generic-reactionwheel-sim1 \
              generic-reactionwheel-sim2 generic_radio_sim sample_sim \
              generic_star_tracker_sim generic_thruster_sim generic_torquer_sim; do
              docker run -d --name sc_1_${sim} --network=nos3_sc_1 \
                -v "$PWD/sim:/mnt/sim" -w "/mnt/sim" \
                ivvitc/nos3-64:20250124 ./nos3-single-simulator $CFG_FILE $sim
          done

      - name: Run COSMOS system test
        run: |
          sleep 10  # Give everything time to settle
          docker exec -it cosmos_openc3-operator_1 ruby /cosmos/system_test.rb

      - name: Collect COSMOS and FSW logs
        if: always()
        run: |
          mkdir -p logs
          docker logs cosmos_openc3-operator_1 > logs/cosmos.log || true
          docker logs sc_1_nos_engine_server > logs/nos_engine.log || true
          docker logs sc_1_nos_fsw > logs/fsw.log || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nos3-logs
          path: logs/

