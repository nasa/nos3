name: nos3-m01-sc01

services:
  nos3-fortytwo:
    image: docker.io/haisamido/42:master
#    image: ghcr.io/ericstoneking/42:latest
#    image: ghcr.io/ericstoneking/42:latest@sha256:4570edd2ef615acfaceec61c3ce7498255fca9b7dd23632c62b0592519c2c7e0
#    image: ghcr.io/haisamido/nasa-itc-42:latest
#    image: ghcr.io/nasa-itc/42:master
    attach: true
    container_name: sc_1_fortytwo
    hostname: fortytwo
    working_dir: "/opt/nasa-itc/"
    command: '/entrypoint.sh'
    volumes:
      - ${PWD}/../nos3/cfg/sims/InOut:/opt/nasa-itc/42/InOut
      - ${PWD}/42/entrypoint.sh:/entrypoint.sh
      - ${PWD}/42/startapp.sh:/startapp.sh  
    ports:
      - "30090:80"
    environment:
      HEALTHCHECK_PORT: 60000
      DISPLAY: ":1"
    networks:
      - nos3_sc_1
      - nos3_core

  nos3-fsw:
    image: ghcr.io/haisamido/nos3-base-fsw-uart:dev
    attach: true
    depends_on:
      nos3-fortytwo:
        condition: service_started
    container_name: sc_1_nos_fsw
    hostname: nos_fsw
    working_dir: /home/nos3/builds/nos3/
    volumes:
      - ${PWD}/fsw/entrypoint_fsw.sh:/entrypoint.sh
    command: "/entrypoint.sh"
    sysctls:
      fs.mqueue.msg_max: 10000
    ulimits:
      rtprio: 99
    cap_add:
      - sys_nice
    environment:
      HEALTHCHECK_PORT: 60000
    networks:
      nos3_sc_1:
        aliases: 
          - nos-fsw
      nos3_core:

  nos3-nos_engine_server:
    image: ghcr.io/haisamido/nos3-base:dev
    attach: true
    depends_on:
      nos3-fortytwo:
        condition: service_started
    container_name: sc_1_nos_engine_server
    hostname: nos_engine_server
    working_dir: /home/nos3/builds/nos3/sims/build/bin
    command: "/usr/bin/nos_engine_server_standalone -f ./nos_engine_server_config.json"
    volumes:
      - ${PWD}/../nos3/cfg/sims/nos_engine_server_config.json:/home/nos3/builds/nos3/sims/build/bin/nos_engine_server_config.json
    tty: true
    environment:
      HEALTHCHECK_PORT: 60000
    networks:
      nos3_sc_1:
        aliases: 
          - nos-engine-server
          - sc_1_nos_engine_server
      nos3_core:

  nos3-gps:
    image: ghcr.io/haisamido/nos3-base:dev
    attach: true
    depends_on:
      nos3-fortytwo:
        condition: service_started
      nos3-fsw:
        condition: service_started
    container_name: sc_1_gps_sim
    hostname: sc_1_gps_sim
    working_dir: /home/nos3/builds/nos3/sims/build/bin
    command: "./nos3-single-simulator -f ./nos3-simulator.xml gps"
    volumes:
      - ${PWD}/../nos3/cfg/sims/nos3-simulator.xml:/home/nos3/builds/nos3/sims/build/bin/nos3-simulator.xml
    environment:
      HEALTHCHECK_PORT: 60000
    networks:
      - nos3_sc_1
      - nos3_core

  nos3-time:
    image: ghcr.io/haisamido/nos3-base:dev
    attach: true
    depends_on:
      nos3-nos_engine_server:
        condition: service_started
    container_name: nos_time_driver
    hostname: nos_time_driver
    working_dir: /home/nos3/builds/nos3/sims/build/bin
    command: "./nos3-single-simulator -f ./nos3-simulator.xml time"
    volumes:
      - ${PWD}/../nos3/cfg/sims/nos3-simulator.xml:/home/nos3/builds/nos3/sims/build/bin/nos3-simulator.xml
    tty: true
    stdin_open: true
    privileged: true
    environment:
      HEALTHCHECK_PORT: 60000
    networks:
      - nos3_sc_1
      - nos3_core

# TODO: issue is that ${HOME}/.nos3/yamcs is being mounted, and is always rebuilding, not functioning well
  nos3-gsw:
    image: ghcr.io/haisamido/nos3-base:dev
    attach: true
    depends_on:
      nos3-gps:
        condition: service_started
      nos3-fsw:
        condition: service_started
      nos3-truth42sim:
        condition: service_started
    container_name: cosmos_openc3-operator_1
    hostname: cosmos
    working_dir: "/home/nos3/.nos3/yamcs"
    command: "/entrypoint.sh"
    volumes:
      - ${PWD}/yamcs/entrypoint_yamcs.sh:/entrypoint.sh
    ports:
      - "8090:8090" # http
      - "5012:5012" # 
      - "5013:5013" # debug-in
      - "6011:6011" # tlm port
    tty: true
    stdin_open: true
    privileged: true
    environment:
      COMPONENT_DIR: "/home/nos3/builds/nos3/components"
      YAMCS_DATA_DIR: "/home/nos3/.nos3/yamcs/target/yamcs/yamcs-data"
      MVN_REPO_LOCAL: "/home/nos3/.nos3/.m2/repository"
      # YAMCS_ETC_DIR:
      # YAMCS_CACHE_DIR:
      HEALTHCHECK_PORT: 60000
    networks:
      nos3_sc_1:
        aliases: 
          - cosmos
          - yamcs
      nos3_core:

  nos3-truth42sim:
    image: ghcr.io/haisamido/nos3-base:dev
    attach: true
    depends_on:
      nos3-fortytwo:
        condition: service_started
      nos3-nos_engine_server:
        condition: service_started
      nos3-gps:
        condition: service_started
      nos3-time:
        condition: service_started
      nos3-fsw:
        condition: service_started
    container_name: sc_1_truth42sim
    hostname: truth42sim
    working_dir: /home/nos3/builds/nos3/sims/build/bin
    command: "./nos3-single-simulator -f ./nos3-simulator.xml truth42sim"
    volumes:
      - ${PWD}/../nos3/cfg/sims/nos3-simulator.xml:/home/nos3/builds/nos3/sims/build/bin/nos3-simulator.xml
    tty: true
    stdin_open: true
    privileged: true
    environment:
      HEALTHCHECK_PORT: 60000
    networks:
      - nos3_sc_1
      - nos3_core

  nos3-nos_terminal:
    image: ghcr.io/haisamido/nos3-base:dev
    attach: true
    container_name: nos_terminal
    hostname: nos_terminal
    working_dir: /home/nos3/builds/nos3/sims/build/bin
    command: "./nos3-single-simulator -f ./nos3-simulator.xml  truth42sim"
    volumes:
      - ${PWD}/../nos3/cfg/sims/nos3-simulator.xml:/home/nos3/builds/nos3/sims/build/bin/nos3-simulator.xml
    tty: true
    stdin_open: true
    privileged: true
    environment:
      HEALTHCHECK_PORT: 60000
    networks:
      - nos3_sc_1
      - nos3_core

  nos3-nos_udp_terminal:
    image: ghcr.io/haisamido/nos3-base:dev
    attach: true
    container_name: nos_udp_terminal
    hostname: nos_udp_terminal
    working_dir: /home/nos3/builds/nos3/sims/build/bin
    command: "./nos3-single-simulator -f ./nos3-simulator.xml  truth42sim"
    volumes:
      - ${PWD}/../nos3/cfg/sims/nos3-simulator.xml:/home/nos3/builds/nos3/sims/build/bin/nos3-simulator.xml
    tty: true
    stdin_open: true
    privileged: true
    environment:
      HEALTHCHECK_PORT: 60000
    networks:
      - nos3_sc_1
      - nos3_core
  
networks:
  nos3_core:
    driver: bridge
  nos3_sc_1:
